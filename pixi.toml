[workspace]
name = "comfy-h3-container"
version = "0.1.0"
description = "ComfyUI + MiniMax H3 视频生成 + 二次元生图（galgame 素材）容器化部署：统一任务入口 + artokun MCP（容器内 supervisor 托管）"
authors = ["SilenWang"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

# 依赖全部通过 pixi 管理（见 AGENTS.md 的 pixi-first 约束）。
# 宿主侧环境只用来跑 docker compose / 下载脚本等外围任务：MCP 全部在容器内
# （第三方 artokun/comfyui-mcp，supervisord 托管、Streamable HTTP），宿主侧
# 不需要任何 MCP 依赖。
[dependencies]
python = "3.11.*"

[tasks]
# ── Docker 部署 ──────────────────────────────────────────────────────────
build = { cmd = "bash scripts/build_image.sh", description = "后台启动镜像构建（可断点续建，避免前台超时）" }
build-status = { cmd = "bash scripts/build_status.sh", description = "查看后台构建状态与日志尾部" }
build-logs = { cmd = "tail -f .build/build.log", description = "跟踪后台构建日志" }
up = { cmd = "docker compose up -d", description = "启动 ComfyUI + H3 容器（镜像已构建）" }
up-build = { cmd = "docker compose up -d --build", description = "前台构建并启动（适合快速增量构建）" }
down = { cmd = "docker compose down", description = "停止并移除容器" }
restart = { cmd = "docker compose restart comfyui", description = "重启 ComfyUI 容器" }
# 立即卸载 ComfyUI 的常驻模型 + 清空节点缓存（等价 WebUI 的 Free model and node cache）。
# 内存受限时容器内的 comfyui-idle-free 守护会空闲自动释放（.env.example 可调阈值/关闭），
# 这条用于随时手动触发一次。
free = { cmd = "docker exec -u root comfyui-h3 /usr/local/bin/node /opt/ai-dock/bin/comfyui-idle-free.mjs --free-now", description = "立即卸载 ComfyUI 常驻模型、释放显存并丢弃模型页缓存" }
# 内存排查：cgroup 明细（anon/file/inactive_file/pinned）+ 显存 + 守护日志。
mem-status = { cmd = "bash scripts/mem_status.sh {{ container }}", args = [{ arg = "container", default = "comfyui-h3" }], description = "查看 ComfyUI 容器的 cgroup 内存明细、显存、idle-free 状态与日志" }
# 热更新：把最新的 idle-free + 页缓存脚本复制进运行中的容器并重启守护，无需重建镜像。
mem-install = { cmd = "bash scripts/mem_install.sh {{ container }}", args = [{ arg = "container", default = "comfyui-h3" }], description = "把最新 idle-free 守护与页缓存脚本热更新进运行中的容器（不重建镜像）" }
logs = { cmd = "docker compose logs -f comfyui", description = "跟踪容器日志" }
# 修复既有容器：PathchSageAttentionKJ 报 ModuleNotFoundError: No module named 'sageattention'
# 时，在运行中的容器里现场编译安装 SageAttention v2.2.0（无需重建镜像）
fix-sage-attn = { cmd = "bash scripts/install_sageattention.sh", description = "在运行中的容器里现场安装 SageAttention v2.2.0（修复 PathchSageAttentionKJ 的 ModuleNotFoundError）" }
# ── 模型下载 ─────────────────────────────────────────────────────────────
# 只有一个任务 models：模块名作为参数传给脚本（pixi run models <模块>），脚本
# 本体也只有一个 scripts/download_models.sh；下载源固定魔搭（ModelScope），
# 不走 HuggingFace。不传参数默认下载全部模块（all，约 91GB）。
# 已下载完整的文件自动跳过，中断后续传。
models = { cmd = "bash scripts/download_models.sh {{ module }}", args = [{ arg = "module", default = "all" }], description = "下载模型：pixi run models [base|extra|image|qwen-edit|consistency|all]，不带参数默认 all（约 91GB）" }

# ── Comfy MCP ───────────────────────────────────────────────────────────
# 只有第三方 artokun MCP 这一套（supervisord 托管，Streamable HTTP，宿主 9100）：
# 随容器启动，无需宿主任务，日志随容器日志（pixi run logs）。
mcp-config = { cmd = "bash scripts/mcp_client_config.sh", description = "打印 MCP 客户端配置片段（容器内 artokun 托管服务）" }
