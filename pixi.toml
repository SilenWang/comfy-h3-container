[workspace]
name = "comfy-h3-container"
version = "0.1.0"
description = "ComfyUI + MiniMax H3 容器化部署：统一任务入口 + 宿主侧 Comfy MCP Local / 远程 HTTP MCP 环境"
authors = ["SilenWang"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

# 依赖全部通过 pixi 管理（见 AGENTS.md 的 pixi-first 约束）。
# 这里是「宿主侧」环境：用于在宿主机上直接跑官方 Comfy MCP Local
# （容器内也装了同一套，推荐那种更省事的方式，见 README）。
[dependencies]
python = "3.11.*"
# 宿主侧 MCP HTTP 网桥（supergateway）用 Node 运行；容器内的 comfy-mcp/ComfyUI 不受影响。
nodejs = "20.*"

[pypi-dependencies]
# comfy-cli 是 comfy-mcp 的引擎（每个工具都 shell out 到 `comfy --json`）
comfy-cli = ">=1.14.0"
comfy-mcp = "*"

[tasks]
# ── Docker 部署 ──────────────────────────────────────────────────────────
build = { cmd = "bash scripts/build_image.sh", description = "后台启动镜像构建（可断点续建，避免前台超时）" }
build-status = { cmd = "bash scripts/build_status.sh", description = "查看后台构建状态与日志尾部" }
build-logs = { cmd = "tail -f .build/build.log", description = "跟踪后台构建日志" }
up = { cmd = "docker compose up -d", description = "启动 ComfyUI + H3 容器（镜像已构建）" }
up-build = { cmd = "docker compose up -d --build", description = "前台构建并启动（适合快速增量构建）" }
down = { cmd = "docker compose down", description = "停止并移除容器" }
restart = { cmd = "docker compose restart comfyui", description = "重启 ComfyUI 容器" }
logs = { cmd = "docker compose logs -f comfyui", description = "跟踪容器日志" }
# 修复既有容器：PathchSageAttentionKJ 报 ModuleNotFoundError: No module named 'sageattention'
# 时，在运行中的容器里现场编译安装 SageAttention v2.2.0（无需重建镜像）
fix-sage-attn = { cmd = "bash scripts/install_sageattention.sh", description = "在运行中的容器里现场安装 SageAttention v2.2.0（修复 PathchSageAttentionKJ 的 ModuleNotFoundError）" }
# 下载源：默认 modelscope（魔搭，国内快），可用 MODELS_SOURCE=hf 或对应 -hf 任务切回 HuggingFace
models = { cmd = "MODELS_SOURCE=modelscope bash scripts/download_models.sh", description = "下载 MiniMax H3 模型（约 43GB，默认魔搭）" }
models-bg = { cmd = "MODELS_SOURCE=modelscope bash scripts/download_models_bg.sh", description = "后台下载模型（约 43GB，默认魔搭，可断点续传）" }
models-status = { cmd = "bash scripts/models_status.sh", description = "查看后台模型下载进度" }
models-logs = { cmd = "tail -f .build/models.log", description = "跟踪后台模型下载日志" }
# 参考/控制模型（R2V 多视角参考 + Fun ControlNet 动作控制，约 25GB，可选）
models-extra = { cmd = "MODELS_SOURCE=modelscope bash scripts/download_models_extra.sh", description = "下载参考/控制模型（R2V + Pose 动作控制，默认魔搭）" }
models-extra-bg = { cmd = "MODELS_SOURCE=modelscope bash scripts/download_models_bg.sh extra", description = "后台下载参考/控制模型（默认魔搭，可断点续传）" }
models-extra-status = { cmd = "bash scripts/models_status.sh extra", description = "查看后台参考/控制模型下载进度" }
models-extra-logs = { cmd = "tail -f .build/models_extra.log", description = "跟踪后台参考/控制模型下载日志" }
# HuggingFace 源（国内一般不需要；等价于给上面的任务加 MODELS_SOURCE=hf）
models-hf = { cmd = "MODELS_SOURCE=hf bash scripts/download_models.sh", description = "从 HuggingFace 下载 MiniMax H3 模型（约 43GB）" }
models-hf-bg = { cmd = "MODELS_SOURCE=hf bash scripts/download_models_bg.sh", description = "后台从 HuggingFace 下载模型（可断点续传）" }
models-extra-hf = { cmd = "MODELS_SOURCE=hf bash scripts/download_models_extra.sh", description = "从 HuggingFace 下载参考/控制模型" }
models-extra-hf-bg = { cmd = "MODELS_SOURCE=hf bash scripts/download_models_bg.sh extra", description = "后台从 HuggingFace 下载参考/控制模型（可断点续传）" }

# ── Comfy MCP Local ─────────────────────────────────────────────────────
# 推荐：容器内运行（免认证、免宿主 workspace），客户端配置见 mcp-config。
mcp-config = { cmd = "bash scripts/mcp_client_config.sh", description = "打印 MCP 客户端配置片段（默认容器模式）" }
# 备选：宿主侧运行。需要 comfy-cli 已有可用 workspace，见 README。
mcp = { cmd = "comfy-mcp", description = "启动宿主侧 Comfy MCP Local（stdio server）" }
# 远程：把容器内 stdio MCP 网桥成 HTTP，供本机/局域网/远程 MCP 客户端连接。
# supergateway 会自动拉起 `docker exec -i comfyui-h3 comfy-mcp`。
mcp-http = { cmd = "MCP_HTTP_TRANSPORT=streamableHttp bash scripts/mcp_http_server.sh", description = "远程 Streamable HTTP MCP（默认 0.0.0.0:8765/mcp，MCP 现行标准）" }
mcp-sse = { cmd = "MCP_HTTP_TRANSPORT=sse bash scripts/mcp_http_server.sh", description = "远程 HTTP+SSE MCP（默认 0.0.0.0:8765/sse，旧版传输）" }
