; artokun/comfyui-mcp —— 容器内 supervisor 托管服务（Streamable HTTP 传输）。
;
; - 日志写 /var/log/supervisor/comfyui-mcp.log；ai-dock 的 logtail 服务会把
;   /var/log/supervisor/*.log 汇总到容器 stdout，因此 comfyui / caddy /
;   comfyui-mcp 的日志在 `docker logs`（或 `docker compose logs`）里都能同时看到。
; - $USER_NAME 由 base 镜像 init.sh 在启动时替换为实际用户名（与 comfyui.conf 一致）。
; - 由 /opt/ai-dock/bin/supervisor-comfyui-mcp.sh 启动真正的进程。

[program:comfyui-mcp]
user=$USER_NAME
environment=PROC_NAME="%(program_name)s",USER=$USER_NAME,HOME=/home/$USER_NAME
command=/opt/ai-dock/bin/supervisor-comfyui-mcp.sh
process_name=%(program_name)s
numprocs=1
directory=/opt/ComfyUI
priority=200
autostart=true
startsecs=10
startretries=3
autorestart=unexpected
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/comfyui-mcp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=0
stderr_logfile_maxbytes=0
stderr_logfile_backups=0
redirect_stderr=true
