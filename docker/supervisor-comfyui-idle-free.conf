; comfyui-idle-free —— ComfyUI 队列空闲后自动释放常驻占用（容器内 supervisor 托管）。
;
; - 干什么：轮询 /queue，发现队列空闲超过 COMFYUI_IDLE_FREE_SECONDS 秒就调一次
;   POST /free {"unload_models":true,"free_memory":true}，把模型与节点缓存还给系统；
;   随后对模型文件调 posix_fadvise(DONTNEED) 丢弃**页缓存**（/free 不会动它，而
;   `docker stats` 的 MEM USAGE 里很大一部分正是页缓存）。日志会打印释放前后的
;   cgroup 明细（working set / anon / file / inactive_file / pinned）与显存。
; - 为什么：ComfyUI 默认跑完不释放（模型留在显存 / 卸载到内存继续留着，页缓存也算在
;   容器内存里）。容器内存被限死时占用会越堆越多，后续任务被换页拖死甚至 OOM。
; - 不会打断推理：/free 只置队列 flag，由 prompt_worker 在循环里消费，正在跑的任务
;   读不到 flag，最坏情况也是「当前任务跑完才释放」。
; - 以 root 运行：可选的重启兜底（COMFYUI_IDLE_FREE_RESTART_SECONDS > 0）需要
;   `supervisorctl restart comfyui` / 读 /var/run/supervisor.sock；脚本本身只访问
;   本机 HTTP 与模型文件，不监听端口、不接收外部输入。
; - 日志走 stdout -> /var/log/supervisor/comfyui-idle-free.log -> ai-dock logtail ->
;   `docker logs`，与 comfyui / caddy / comfyui-mcp 的日志汇总在一起。
; - 开关与阈值从容器环境继承（见 .env.example / docs/troubleshooting.md），
;   在 .env 里改；改完需 `docker compose up -d` 重建容器才生效。

[program:comfyui-idle-free]
user=root
environment=PROC_NAME="%(program_name)s",USER=root,HOME=/root
command=/usr/local/bin/node /opt/ai-dock/bin/comfyui-idle-free.mjs
process_name=%(program_name)s
numprocs=1
directory=/opt/ComfyUI
priority=210
autostart=true
startsecs=5
startretries=3
autorestart=unexpected
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/comfyui-idle-free.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=0
stderr_logfile_maxbytes=0
stderr_logfile_backups=0
redirect_stderr=true
