; comfyui-idle-free —— ComfyUI 队列空闲后自动释放常驻占用（容器内 supervisor 托管）。
;
; - 干什么：轮询 /queue，发现队列空闲超过 COMFYUI_IDLE_FREE_SECONDS 秒就调一次
;   POST /free {"unload_models":true,"free_memory":true}，把模型与节点缓存还给系统。
;   这是 ComfyUI 跑完任务后**唯一**的释放口（WebUI 的「Free model and node cache」同款）。
; - 为什么：ComfyUI 默认跑完不释放（模型留在显存 / 卸载到内存继续留着，页缓存也算在
;   容器内存里）。容器内存被限死时占用会越堆越高，后续任务被换页拖死甚至 OOM。
; - 不会打断推理：/free 只置队列 flag，由 prompt_worker 在循环里消费，正在跑的任务
;   读不到 flag，最坏情况也是「当前任务跑完才释放」。
; - 日志走 stdout -> /var/log/supervisor/comfyui-idle-free.log -> ai-dock logtail ->
;   `docker logs`，与 comfyui / caddy / comfyui-mcp 的日志汇总在一起。
; - 开关与阈值从容器环境继承：COMFYUI_IDLE_FREE_ENABLE（默认 true）、
;   COMFYUI_IDLE_FREE_SECONDS（默认 60）、COMFYUI_IDLE_FREE_POLL（默认 3），
;   在 .env 里改；改完需 `docker compose up -d` 重建容器才生效。
; - $USER_NAME 由 base 镜像 init.sh 在启动时替换为实际用户名（与 comfyui.conf 一致）。

[program:comfyui-idle-free]
user=$USER_NAME
environment=PROC_NAME="%(program_name)s",USER=$USER_NAME,HOME=/home/$USER_NAME
command=/usr/local/bin/node /opt/ai-dock/bin/comfyui-idle-free.mjs
process_name=%(program_name)s
numprocs=1
directory=/opt/ComfyUI
priority=210
autostart=true
startsecs=5
startretries=3
autorestart=unexpected
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/comfyui-idle-free.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=0
stderr_logfile_maxbytes=0
stderr_logfile_backups=0
redirect_stderr=true
