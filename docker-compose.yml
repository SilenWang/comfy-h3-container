# ComfyUI + MiniMax H3 一键部署（docker compose）
# 前提：NVIDIA GPU + nvidia-container-toolkit（docker run --gpus all 可用）
#
# 用法：
#   cp .env.example .env           # 认证等配置（默认已关闭密码）
#   ./scripts/download_models.sh   # 下载模型（约 43GB）
#   docker compose up -d --build   # 或：pixi run build 后台续建 + pixi run up
#   # WebUI: http://localhost:8188  （默认免密；开启认证则账号 user / 密码见 .env）
#
# AI 辅助（都随容器由 supervisord 托管，日志统一进 `docker compose logs`）：
#   Comfy MCP Local   容器内官方 stdio server，客户端用 `docker exec -i` 调起；
#                     配置见 `pixi run mcp-config`（默认容器模式）
#   artokun MCP       容器内服务（Streamable HTTP，端口 19100→宿主 9100），随容器启动，
#                     能让 Agent 直接搭建/编辑工作流；配置见 `pixi run mcp-config artokun`
services:
  comfyui:
    build: .
    image: comfy-h3-container:latest
    container_name: comfyui-h3
    restart: unless-stopped
    # NVIDIA GPU 透传（等价 docker run --gpus all）
    gpus: all
    ports:
      - "8188:8188"
      # artokun MCP（容器内 supervisor 托管，Streamable HTTP）映射到宿主。
      # 绑 0.0.0.0（不写 IP 即全部接口）：同机其他容器与局域网都能访问。
      #   同机其他容器不能用 127.0.0.1（那是容器自己的 loopback），要用宿主 IP 或
      #   `--add-host host.docker.internal:host-gateway`（详见 README）。
      # 想收回成只允许宿主机本机访问：改成 "127.0.0.1:9100:19100"。
      # 对外暴露前务必把 .env 里的 COMFYUI_MCP_HTTP_TOKEN 改成强随机值。
      - "9100:19100"
      # 可选：容器内 ComfyUI 直连端口（18188），供调试 / 绕过 caddy 认证时使用。
      # 仅绑定 127.0.0.1，不对局域网/公网暴露。
      # - "127.0.0.1:18188:18188"
    environment:
      # WebUI 认证：由 ai-dock 基础镜像内置的 caddy 反向代理提供，
      # 不是 ComfyUI 自带功能，也非必须。局域网自用可在 .env 里关闭：
      #   WEB_ENABLE_AUTH=false
      # 关闭后免密码访问，宿主侧脚本 / MCP 调用也不必再带凭证。
      # ⚠️ 关闭后任何能访问该端口的人都能使用，切勿在公网暴露的机器上关闭。
      WEB_ENABLE_AUTH: ${WEB_ENABLE_AUTH:-true}
      # 修改密码：在 .env 中设置 WEB_PASSWORD
      WEB_PASSWORD: ${WEB_PASSWORD:-comfy-h3}
      # 容器内 ComfyUI 监听端口（必须与 COMFYUI_PORT_HOST 不同，避免与 caddy 冲突）
      COMFYUI_PORT_LOCAL: "18188"
      COMFYUI_PORT_HOST: "8188"
      # --lowvram：按需加载/卸载，12GB 显卡实测关键参数
      COMFYUI_ARGS: "--listen 0.0.0.0 --lowvram"
      # artokun MCP（容器内）的入站鉴权令牌；远程客户端需带 Authorization: Bearer <token>
      COMFYUI_MCP_HTTP_TOKEN: ${COMFYUI_MCP_HTTP_TOKEN:-comfy-h3-mcp}
    volumes:
      # 模型目录：默认仓库内 ./models。可用 .env 的 MODELS_DIR 指向外部目录
      # （绝对路径或相对本文件），便于多项目共用同一份模型、避免重复下载：
      #   MODELS_DIR=/data/ai-models/comfy-h3
      # 目录需提前存在且当前用户可写（Docker 会以 root 创建不存在的 bind 源，
      # 导致容器内 uid 1000 读不到/写不进）。model 目录一般只读即可，可加 :ro。
      - ${MODELS_DIR:-./models}:/workspace/models
      # 生成结果持久化（同样可用 OUTPUT_DIR 指定外部目录）
      - ${OUTPUT_DIR:-./output}:/opt/ComfyUI/output
      # 用户工作流持久化：仓库内自带调好的 H3 T2V 模板，容器每次启动都在
      # WebUI 的 Workflows 列表里；在 WebUI 里保存的工作流也会落到这里。
      - ./workflows:/opt/ComfyUI/user/default/workflows
    # 可选：限制资源
    # deploy:
    #   resources:
    #     limits:
    #       memory: 64G
